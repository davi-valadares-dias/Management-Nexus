<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 800px;">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Cadastro de Produto</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Nome do Produto</label>
                        {{ form.nome }}
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">SKU (Código)</label>
                        {{ form.sku }}
                    </div>
                    <!-- CAMPO NOVO AQUI -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Cód. de Barras</label>
                        {{ form.codigo_barras }}
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Categoria</label>
                        {{ form.categoria }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Unidade de Medida</label>
                        {{ form.unidade_medida }}
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Preço Custo (R$)</label>
                        {{ form.preco_custo }}
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Preço Venda (R$)</label>
                        {{ form.preco_venda }}
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Estoque Mín.</label>
                        {{ form.estoque_minimo }}
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Estoque Atual</label>
                        {{ form.estoque_atual }}
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-dark">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
