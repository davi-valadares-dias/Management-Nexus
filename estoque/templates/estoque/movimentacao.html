<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Movimentação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Registrar Entrada / Saída</h4>
        </div>
        <div class="card-body">
            <!-- Formulário que envia os dados via POST -->
            <form method="POST">
                {% csrf_token %} <!-- Código de segurança obrigatório do Django -->

                <div class="mb-3">
                    <label class="form-label fw-bold">Produto</label>
                    {{ form.produto }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Movimentação</label>
                    {{ form.tipo }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Quantidade</label>
                    {{ form.quantidade }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Motivo</label>
                    {{ form.motivo }}
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
