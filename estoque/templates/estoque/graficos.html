<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Gráficos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bar-chart-fill text-primary"></i> Painel de Categorias</h2>
        <a href="/" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Voltar ao Dashboard
        </a>
    </div>

    <!-- O JS vai desenhar os blocos de gráficos aqui dentro -->
    <div class="row" id="graficos-container"></div>
</div>

<script>
    const graficosData = {{ graficos_json|safe }};
    const container = document.getElementById('graficos-container');

    graficosData.forEach(grafico => {
        // Cria o layout (2 gráficos por linha)
        const col = document.createElement('div');
        col.className = 'col-md-6 mb-4';

        const card = document.createElement('div');
        card.className = 'card shadow-sm h-100';

        const cardBody = document.createElement('div');
        cardBody.className = 'card-body';

        const title = document.createElement('h5');
        title.className = 'card-title text-secondary mb-3 fw-bold';
        title.innerText = grafico.titulo;

        const canvas = document.createElement('canvas');
        canvas.id = grafico.id;

        // Monta os elementos na tela
        cardBody.appendChild(title);
        cardBody.appendChild(canvas);
        card.appendChild(cardBody);
        col.appendChild(card);
        container.appendChild(col);

        // Ativa o Chart.js
        const ctx = document.getElementById(grafico.id).getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: grafico.nomes,
                datasets: [{
                    label: 'Quantidade em Estoque',
                    data: grafico.quantidades,
                    backgroundColor: 'rgba(13, 110, 253, 0.6)',
                    borderColor: 'rgba(13, 110, 253, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true } }
            }
        });
    });
</script>

</body>
</html>
